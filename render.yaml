services:
  # FastAPI backend -- serves /api/* from the committed data/out aggregates.
  - type: web
    name: wallet-radar-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # Prompted for at Blueprint creation time, never committed.
      - key: OPENAI_API_KEY
        sync: false
      # Set this to the frontend's actual onrender.com URL once it's known
      # (see wallet-radar-web below) -- lets the browser's CORS check pass.
      - key: FRONTEND_ORIGIN
        sync: false

  # Static frontend -- the /api/* rewrite makes the existing relative-path
  # fetch('/api/...') calls in web/src/lib/api.ts work unchanged in
  # production, exactly as Vite's own dev-server proxy does locally.
  - type: web
    name: wallet-radar-web
    runtime: static
    plan: free
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://wallet-radar-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
